<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>רשימות — הדמיית טלפון</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f5f5f5;
    margin: 0; padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    height: 100vh; overflow: hidden;
  }

  .phone {
    width: 100%; height: 100vh;
    background: #f5f5f5;
    position: relative; display: flex; flex-direction: column;
  }
  .phone-screen {
    flex: 1; background: #f5f5f5;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .notch { display: none; }
  .status-bar { display: none; }

  /* Screens */
  .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }

  /* Home */
  .home-header {
    background: linear-gradient(135deg, #4a90d9, #357abd);
    padding: 18px 20px 24px; color: #fff;
  }
  .home-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .home-header p  { font-size: 13px; opacity: .8; }

  .lists-container { flex: 1; overflow-y: auto; padding: 16px 16px 80px; }

  .list-card {
    background: #fff; border-radius: 16px; padding: 14px 16px;
    margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08); cursor: pointer;
    transition: transform .1s; -webkit-tap-highlight-color: transparent;
  }
  .list-card:active { transform: scale(.97); }
  .list-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .list-info { flex: 1; }
  .list-name { font-size: 15px; font-weight: 600; color: #222; }
  .list-meta { font-size: 11px; color: #999; margin-top: 3px; display: flex; gap: 8px; align-items: center; }
  .type-badge {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px;
  }
  .list-arrow { color: #ccc; font-size: 18px; }
  .card-action-btn {
    background: none; border: none; font-size: 18px;
    cursor: pointer; padding: 6px; border-radius: 8px;
    color: #aaa; transition: background .15s;
  }
  .card-action-btn:active { background: #eee; }

  /* FAB area */
  .fab-area {
    display: flex; gap: 12px; align-items: center; justify-content: center;
    padding: 10px 0 10px;
  }
  .fab {
    width: 56px; height: 56px; background: #4a90d9; border-radius: 50%;
    border: none; color: #fff; font-size: 28px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(74,144,217,.5);
    display: flex; align-items: center; justify-content: center;
  }
  .fab-template {
    width: 44px; height: 44px; background: #8e44ad; border-radius: 50%;
    border: none; color: #fff; font-size: 20px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(142,68,173,.4);
    display: flex; align-items: center; justify-content: center;
  }

  /* Modal */
  .modal-overlay {
    display: none; position: absolute; inset: 0;
    background: rgba(0,0,0,.4); border-radius: 36px;
    z-index: 50; align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: #fff; width: 100%;
    border-radius: 24px 24px 0 0; padding: 20px 20px 36px;
  }
  .modal-handle {
    width: 40px; height: 4px; background: #ddd;
    border-radius: 2px; margin: 0 auto 16px;
  }
  .modal-sheet h2 { font-size: 17px; margin-bottom: 14px; color: #222; }

  /* Type selector */
  .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .type-opt {
    flex: 1; padding: 12px 8px; border-radius: 12px;
    border: 2px solid #eee; background: #f8f8f8;
    cursor: pointer; text-align: center; transition: all .15s;
  }
  .type-opt .type-icon { font-size: 24px; display: block; margin-bottom: 4px; }
  .type-opt .type-label { font-size: 12px; font-weight: 600; color: #555; }
  .type-opt.selected { border-color: #4a90d9; background: #e8f2fd; }
  .type-opt.selected .type-label { color: #4a90d9; }

  .emoji-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .emoji-btn {
    width: 38px; height: 38px; border-radius: 10px;
    border: 2px solid #eee; background: #f8f8f8; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .emoji-btn.selected { border-color: #4a90d9; background: #e8f2fd; }

  .modal-input {
    width: 100%; padding: 11px 13px;
    border: 1.5px solid #ddd; border-radius: 12px;
    font-size: 15px; font-family: inherit;
    text-align: right; direction: rtl; outline: none; margin-bottom: 12px;
  }
  .modal-input:focus { border-color: #4a90d9; }
  .modal-btn {
    width: 100%; padding: 13px; background: #4a90d9; color: #fff;
    border: none; border-radius: 14px; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }

  /* Detail header */
  .detail-header {
    padding: 16px 16px 18px; display: flex; align-items: center;
    gap: 10px; color: #fff;
  }
  .back-btn {
    background: rgba(255,255,255,.2); border: none; color: #fff;
    width: 34px; height: 34px; border-radius: 10px; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .detail-title { font-size: 19px; font-weight: 700; flex: 1; }
  .detail-icon-big { font-size: 26px; }

  /* Add bar — shopping */
  .add-bar-simple {
    background: #fff; padding: 10px 12px;
    display: flex; gap: 8px; border-bottom: 1px solid #eee;
  }

  /* Add bar — tasks (two rows) */
  .add-bar-task {
    background: #fff; padding: 10px 12px 8px;
    border-bottom: 1px solid #eee; display: flex; flex-direction: column; gap: 7px;
  }
  .add-bar-row { display: flex; gap: 7px; }

  .add-input {
    flex: 1; padding: 9px 11px;
    border: 1.5px solid #ddd; border-radius: 10px;
    font-size: 14px; font-family: inherit;
    text-align: right; direction: rtl; outline: none;
  }
  .add-input:focus { border-color: #4a90d9; }

  .add-btn {
    color: #fff; border: none; border-radius: 10px;
    width: 38px; font-size: 22px; cursor: pointer; flex-shrink: 0;
  }

  /* Priority selector inline */
  .pri-sel {
    display: flex; gap: 5px;
  }
  .pri-btn {
    flex: 1; padding: 7px 4px; border-radius: 8px; border: 2px solid transparent;
    font-size: 11px; font-weight: 700; cursor: pointer; text-align: center;
    transition: border-color .15s;
  }
  .pri-btn.sel { border-color: #333; }

  /* Date input */
  .date-input {
    flex: 1; padding: 8px 10px;
    border: 1.5px solid #ddd; border-radius: 10px;
    font-size: 13px; font-family: inherit;
    text-align: right; direction: rtl; outline: none; color: #555;
  }
  .date-input:focus { border-color: #4a90d9; }

  /* Items list */
  .items-list { flex: 1; overflow-y: auto; padding: 10px 12px; }

  /* Shopping item */
  .item-row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; background: #fff; border-radius: 12px;
    margin-bottom: 7px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .item-check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #4a90d9; flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .item-check.checked { background: #4a90d9; border-color: #4a90d9; }
  .item-check.checked::after { content: '✓'; color: #fff; font-size: 12px; font-weight: 700; }
  .item-text { flex: 1; font-size: 14px; color: #222; cursor: pointer; }
  .item-text.done { text-decoration: line-through; color: #bbb; }
  .item-del {
    color: #ddd; font-size: 17px; cursor: pointer;
    border: none; background: none; padding: 0 2px; flex-shrink: 0;
  }
  .item-del:hover { color: #e74c3c; }

  /* Task item — two-line card */
  .task-card {
    background: #fff; border-radius: 12px;
    margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    overflow: hidden;
  }
  .task-card-bar { width: 4px; border-radius: 0; flex-shrink: 0; align-self: stretch; }
  .task-main { display: flex; align-items: center; gap: 9px; padding: 10px 12px 6px; }
  .task-footer { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 9px; }
  .task-date { font-size: 11px; color: #999; }
  .task-date.overdue { color: #e74c3c; font-weight: 600; }
  .pri-tag {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
    cursor: pointer;
  }

  /* Edit input inline */
  .item-edit-input {
    flex: 1; border: none; border-bottom: 2px solid #4a90d9;
    font-size: 14px; font-family: inherit; background: transparent;
    outline: none; text-align: right; direction: rtl; padding: 2px 0; color: #222;
  }

  .empty-msg {
    text-align: center; color: #bbb; margin-top: 40px;
    font-size: 13px; line-height: 1.8;
  }
  .empty-msg .big { font-size: 38px; display: block; margin-bottom: 8px; }

  /* Template screen hint */
  .template-hint {
    background: #f9f0ff; padding: 9px 14px;
    font-size: 12px; color: #8e44ad; text-align: right;
    border-bottom: 1px solid #edd6f8;
  }

  /* Bottom nav */
  .bottom-nav {
    background: #fff; border-top: 1px solid #eee;
    display: flex; justify-content: space-around; align-items: center;
    padding: 8px 0 calc(96px + env(safe-area-inset-bottom, 0px)); flex-shrink: 0;
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    border: none; background: none; cursor: pointer;
    color: #bbb; font-size: 10px; padding: 4px 0;
  }
  .nav-btn .nav-icon { font-size: 19px; }
  .nav-btn.active { color: #4a90d9; }
</style>
</head>
<body>

<!-- מסך כניסה -->
<div id="login-screen" style="display:none;position:fixed;inset:0;background:#f5f5f5;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:999">
  <div style="font-size:64px">📋</div>
  <h1 style="font-size:24px;color:#333">הרשימות שלי</h1>
  <p style="color:#888;font-size:14px">כנס כדי לראות את הרשימות שלך</p>
  <button onclick="loginWithGoogle()" style="display:flex;align-items:center;gap:10px;padding:14px 24px;border:1px solid #ddd;border-radius:12px;background:#fff;font-size:16px;cursor:pointer;box-shadow:0 2px 8px #0001">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="22">
    כניסה עם Google
  </button>
</div>

<div id="app-screen" style="display:none;width:100%;height:100vh;flex-direction:column">
<div class="phone">
  <div class="notch"></div>
  <div class="phone-screen">

    <div class="status-bar">
      <span>9:41</span><span>📶 🔋</span>
    </div>

    <!-- ══ HOME ══ -->
    <div class="screen active" id="screen-home">
      <div class="home-header">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h1>הרשימות שלי 📋</h1>
          <button onclick="logout()" style="border:none;background:none;color:#aaa;font-size:13px;cursor:pointer">יציאה</button>
        </div>
        <p id="home-subtitle"></p>
        <p id="user-name" style="font-size:12px;color:#aaa;margin-top:2px"></p>
      </div>
      <div class="lists-container" id="lists-container"></div>


      <!-- New list modal -->
      <div class="modal-overlay" id="new-list-modal">
        <div class="modal-sheet">
          <div class="modal-handle"></div>
          <h2>רשימה חדשה</h2>

          <div class="type-selector">
            <div class="type-opt selected" id="type-shop" onclick="selectType('shop')">
              <span class="type-icon">🛒</span>
              <span class="type-label">קניות</span>
            </div>
            <div class="type-opt" id="type-tasks" onclick="selectType('tasks')">
              <span class="type-icon">✅</span>
              <span class="type-label">משימות</span>
            </div>
            <div class="type-opt" id="type-links" onclick="selectType('links')">
              <span class="type-icon">🔗</span>
              <span class="type-label">הפניות</span>
            </div>
            <div class="type-opt" id="type-stocks" onclick="selectType('stocks')">
              <span class="type-icon">📈</span>
              <span class="type-label">מניות</span>
            </div>
          </div>

          <div class="emoji-row" id="emoji-row"></div>

      </div>
    </div>

    <!-- ══ TEMPLATE ══ -->

async function save() {
  if (DOC) await setDoc(DOC, data);
}

async function loadFromCloud() {
  try {
    const snap = await getDoc(DOC);
    if (snap.exists()) {
      data = snap.data();
      if (!data.template) data.template = [];
    } else {
      // העברת נתונים ישנים מ-gurgurs אם קיימים
      const oldDoc  = doc(db, "users", "gurgurs");
      const oldSnap = await getDoc(oldDoc);
      if (oldSnap.exists()) {
        data = oldSnap.data();
        if (!data.template) data.template = [];
        await setDoc(DOC, data);
      }
    }
  } catch(e) {
    console.error("שגיאת טעינה:", e);
  }
  renderHome();
}

let _loginInProgress = false;
async function loginWithGoogle() {
  if (_loginInProgress) return;
  _loginInProgress = true;
  try {
    await signInWithPopup(auth, provider);
  } catch(e) {
    if (e.code !== 'auth/cancelled-popup-request' && e.code !== 'auth/popup-closed-by-user') {
      alert('שגיאת כניסה: ' + e.message);
    }
  } finally {
    _loginInProgress = false;
  }
}

async function logout() {
  await signOut(auth);
}

const ADMIN_EMAIL = 'gurgurs@gmail.com';
const CONFIG_DOC  = doc(db, "config", "allowed_users");

async function isAllowed(email) {
  try {
    const snap = await getDoc(CONFIG_DOC);
    if (!snap.exists()) {
      await setDoc(CONFIG_DOC, { allowed: [{ email: ADMIN_EMAIL, active: true }] });
      return email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
    }
    const list = normalizeList(snap.data().allowed);
    // אם הרשימה עדיין בפורמט ישן — שמור מחדש בפורמט חדש
    if (snap.data().allowed.some(u => typeof u === 'string')) {
      await setDoc(CONFIG_DOC, { allowed: list });
    }
    const user = list.find(u => u.email.toLowerCase() === email.toLowerCase());
    return user ? user.active === true : false;
  } catch(e) {
    return email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
  }
}

onAuthStateChanged(auth, async user => {
  if (user) {
    if (!await isAllowed(user.email)) {
      await signOut(auth);
      document.getElementById('login-screen').innerHTML = `
        <div style="font-size:64px">🚫</div>
        <h2 style="color:#333">אין גישה</h2>
        <p style="color:#888;font-size:14px">${user.email} אינו מורשה</p>
        <button onclick="loginWithGoogle()" style="margin-top:16px;padding:10px 20px;border-radius:10px;border:1px solid #ddd;background:#fff;cursor:pointer">נסה חשבון אחר</button>`;
      document.getElementById('login-screen').style.display = 'flex';
      return;
    }
    currentUser = user;
    DOC = doc(db, "users", user.uid);
    data = { lists: [], template: [] };
    await loadFromCloud();
    try {
      const keysSnap = await getDoc(doc(db, "config", "keys"));
      if (keysSnap.exists()) { CLAUDE_KEY = keysSnap.data().claude || ''; console.log('key loaded:', CLAUDE_KEY.slice(0,10)); }
      else console.log('keys doc not found');
    } catch(e) { console.log('key load error:', e.message); }
    document.getElementById('user-name').textContent = user.displayName || user.email;
    const isAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
    document.getElementById('admin-nav-btn').style.display = isAdmin ? '' : 'none';
    showAppScreen();
  } else {
    currentUser = null;
    DOC = null;
    showLoginScreen();
  }
});

function renderHome() {
  const container = document.getElementById('lists-container');
  const subtitle  = document.getElementById('home-subtitle');

  subtitle.textContent = n ? `${n} רשימות` : 'לחץ + ליצירת רשימה';

  container.innerHTML = '';
  data.lists.forEach((list, i) => {
    const isTask = list.type === 'tasks';
    const done   = list.items.filter(it => it.done).length;
    const total  = list.items.length;
    const p      = isTask ? PRI : null;

    const isLinks   = list.type === 'links';
    const isStocks  = list.type === 'stocks';
    const typeColor = isTask ? '#27ae60' : isLinks ? '#e67e22' : isStocks ? '#16a085' : '#4a90d9';
    const typeLabel = isTask ? '✅ משימות' : isLinks ? '🔗 הפניות' : isStocks ? '📈 מניות' : '🛒 קניות';

    const card = document.createElement('div');
    card.className = 'list-card';
    card.innerHTML = `
      <div class="list-icon" style="background:${list.color}22">${list.emoji}</div>
      <div class="list-info">
        <div class="list-name">${list.name}</div>
        <div class="list-meta">
          <span class="type-badge" style="background:${typeColor}18;color:${typeColor}">${typeLabel}</span>
          <span>${total ? `${done}/${total}` : 'ריקה'}</span>
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="card-action-btn rename-btn" title="שנה שם">✎</button>
        <button class="card-action-btn duplicate-btn" title="שכפל">📋</button>
        <button class="card-action-btn delete-btn" style="color:#e74c3c" title="מחק">🗑</button>
      </div>`;

    card.querySelector('.rename-btn').addEventListener('click', e => { e.stopPropagation(); renameList(i); });
    card.querySelector('.duplicate-btn').addEventListener('click', e => { e.stopPropagation(); duplicateList(i); });
    card.querySelector('.delete-btn').addEventListener('click', e => { e.stopPropagation(); deleteList(i); });
    card.onclick = () => openList(i);
    container.appendChild(card);
  });
}

function renameList(idx) {
  const input = document.getElementById('rename-input');
  input.value = data.lists[idx].name;
  document.getElementById('rename-modal').classList.add('open');
  setTimeout(() => input.focus(), 100);
  document.getElementById('rename-confirm-btn').onclick = () => {
    const val = input.value.trim();
    if (val) { data.lists[idx].name = val; save(); renderHome(); }
    closeRenameModal();
  };
  input.onkeydown = e => { if (e.key === 'Enter') document.getElementById('rename-confirm-btn').click(); };
}

function showConfirm(text, callback) {
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:flex-end;justify-content:center';
  modal.innerHTML = `
    <div style="background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:24px 20px 40px;text-align:center">
      <p style="font-size:16px;margin-bottom:24px;color:#222;font-family:inherit">${text}</p>
      <div style="display:flex;gap:12px">
        <button id="cm-no"  style="flex:1;padding:13px;border:1px solid #ddd;border-radius:12px;background:#fff;font-size:15px;cursor:pointer;font-family:inherit">לא</button>
        <button id="cm-yes" style="flex:1;padding:13px;border:none;border-radius:12px;background:#4a90d9;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">כן</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  const close = (result) => { document.body.removeChild(modal); callback(result); };
  modal.querySelector('#cm-yes').addEventListener('click', () => close(true));
  modal.querySelector('#cm-no').addEventListener('click',  () => close(false));
}

function closeRenameModal() {
  document.getElementById('rename-modal').classList.remove('open');
}

function duplicateList(idx) {
  const input = document.getElementById('rename-input');
  input.value = data.lists[idx].name + ' (עותק)';
  document.getElementById('rename-modal').classList.add('open');
  setTimeout(() => { input.focus(); input.select(); }, 100);
  document.getElementById('rename-confirm-btn').onclick = () => {
    const val = input.value.trim();
    if (val) {
      const copy = JSON.parse(JSON.stringify(data.lists[idx]));
      copy.name = val;
      copy.items = copy.items.map(it => ({...it, done: false}));
      data.lists.push(copy);
      save(); renderHome();
    }
    closeRenameModal();
  };
  input.onkeydown = e => { if (e.key === 'Enter') document.getElementById('rename-confirm-btn').click(); };
}

function deleteList(idx) {
  if (confirm(`למחוק את הרשימה "${data.lists[idx].name}"?`)) {
    data.lists.splice(idx, 1);
    save(); renderHome();
  }
}

let selectedStockMode = 'recommendations';

function selectStockMode(mode) {
  selectedStockMode = mode;
  document.getElementById('smode-rec').classList.toggle('selected',  mode === 'recommendations');
  document.getElementById('smode-port').classList.toggle('selected', mode === 'portfolio');
}

function selectType(t) {
  selectedType = t;
  document.getElementById('type-shop').classList.toggle('selected',   t === 'shop');
  document.getElementById('type-tasks').classList.toggle('selected',  t === 'tasks');
  document.getElementById('type-links').classList.toggle('selected',  t === 'links');
  document.getElementById('type-stocks').classList.toggle('selected', t === 'stocks');
  document.getElementById('stock-mode-row').style.display = t === 'stocks' ? 'flex' : 'none';
  if (t === 'stocks') selectStockMode('recommendations');
  buildEmojiRow();
}

function buildEmojiRow() {
  const emojis = selectedType === 'tasks' ? EMOJIS_TASKS :
                 selectedType === 'links'  ? EMOJIS_LINKS :
                 selectedType === 'stocks' ? EMOJIS_STOCKS : EMOJIS_SHOP;
  selectedEmoji = emojis[0];
  const row = document.getElementById('emoji-row');
  row.innerHTML = '';
  emojis.forEach((em, i) => {
    const btn = document.createElement('button');
    btn.className = 'emoji-btn' + (i === 0 ? ' selected' : '');
    btn.textContent = em;
    btn.onclick = () => {
      row.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedEmoji = em;
    };
    row.appendChild(btn);
  });
}

function openNewListModal() {
  selectedType = 'shop';
  document.getElementById('type-shop').classList.add('selected');
  document.getElementById('type-tasks').classList.remove('selected');
  buildEmojiRow();
  document.getElementById('new-list-name').value = '';
  document.getElementById('new-list-modal').classList.add('open');
  setTimeout(() => document.getElementById('new-list-name').focus(), 100);
}

document.getElementById('new-list-modal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

function createList() {
  const name = document.getElementById('new-list-name').value.trim();
  if (!name) { document.getElementById('new-list-name').focus(); return; }
  const color = COLORS[data.lists.length % COLORS.length];
  const stockMode = selectedType === 'stocks' ? selectedStockMode : undefined;
  document.getElementById('new-list-modal').classList.remove('open');
  const finishCreate = (withTemplate) => {
    const items = (withTemplate && data.template.length > 0)
      ? data.template.map(t => ({ text: t, done: false }))
      : [];
    data.lists.push({ name, emoji: selectedEmoji, color, type: selectedType, stockMode, items });
    save();
    renderHome();
    openList(data.lists.length - 1);
  };
  if (selectedType === 'shop' && data.template.length > 0) {
    showConfirm('לצרף את רשימת הבסיס?', finishCreate);
  } else {
    finishCreate(false);
  }
}

function openList(idx) {
  currentListIdx = idx;
  const list = data.lists[idx];
  const isTask   = list.type === 'tasks';
  const isLinks  = list.type === 'links';
  const isStocks = list.type === 'stocks';

  document.getElementById('detail-icon').textContent  = list.emoji;
  document.getElementById('detail-title').textContent = list.name;
  document.getElementById('detail-header').style.background =
    isTask   ? 'linear-gradient(135deg,#27ae60,#1e8449)' :
    isLinks  ? 'linear-gradient(135deg,#e67e22,#ca6f1e)' :
    isStocks ? 'linear-gradient(135deg,#16a085,#1a7a64)' :
               `linear-gradient(135deg,${list.color},${list.color}bb)`;

  document.getElementById('add-bar-shop').style.display   = (!isTask && !isLinks && !isStocks) ? 'flex' : 'none';
  document.getElementById('add-bar-task').style.display   = isTask   ? 'flex' : 'none';
  document.getElementById('add-bar-links').style.display  = isLinks  ? 'flex' : 'none';
  document.getElementById('add-bar-stocks').style.display = isStocks ? 'flex' : 'none';

  if (!isTask && !isLinks && !isStocks) document.getElementById('new-item-input').value = '';
  else if (isTask)   { document.getElementById('new-task-input').value = ''; document.getElementById('new-task-date').value = ''; }
  else if (isLinks)  { document.getElementById('new-link-name').value = ''; document.getElementById('new-link-url').value = ''; }
  else if (isStocks) {
    document.getElementById('new-stock-ticker').value = '';
    document.getElementById('new-stock-price').value  = '';
    document.getElementById('new-stock-date').value   = '';
    document.getElementById('new-stock-analyst').value = '';
    const isPortfolio = list.stockMode === 'portfolio';
    document.getElementById('new-stock-analyst').placeholder = isPortfolio ? 'הערה (אופציונלי)' : 'אנליסט';
  }

  showScreen('screen-detail');
  setTimeout(() => {
    const inp = isTask ? 'new-task-input' : isLinks ? 'new-link-name' : isStocks ? 'new-stock-ticker' : 'new-item-input';
    document.getElementById(inp).focus();
  }, 150);

  renderItems();
  if (isStocks) startStockRefresh(); else stopStockRefresh();
}

function goHome() {

  renderHome();
}

// ── Render items ──────────────────────────────────────────────────────────
function renderItems() {
  const list = data.lists[currentListIdx];
  const container = document.getElementById('items-list');
  container.innerHTML = '';

  if (!list.items.length) {
    container.innerHTML = `<div class="empty-msg">
      <span class="big">${list.emoji}</span>
      הרשימה ריקה — הוסף פריט ראשון
    </div>`;
    return;
  }

  if (list.type === 'tasks') {
    const sorted = [...list.items.entries()].sort(([,a],[,b]) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return PRI_ORDER.indexOf(a.priority||'none') - PRI_ORDER.indexOf(b.priority||'none');
    });
    sorted.forEach(([i, item]) => renderTaskCard(container, i, item));
  } else if (list.type === 'stocks') {
    // summary bar
    const summaryEl = document.createElement('div');
    summaryEl.id = 'stock-summary';
    summaryEl.style = 'text-align:center;padding:6px 0 10px;font-size:12px;color:#aaa';
    summaryEl.textContent = 'מחשב ממוצעים...';
    container.appendChild(summaryEl);
    list.items.forEach((item, i) => renderStockRow(container, i, item));
  } else if (list.type === 'links') {
    const sorted = [...list.items.entries()].sort(([,a],[,b]) => (a.done?1:0)-(b.done?1:0));
    sorted.forEach(([i, item]) => renderLinkRow(container, i, item));
  } else {
    const sorted = [...list.items.entries()].sort(([,a],[,b]) => (a.done?1:0)-(b.done?1:0));
    sorted.forEach(([i, item]) => renderShopRow(container, i, item));
  }
}

function makeNotesPanel(i, item) {
  const hasNote = !!item.notes;
  const noteBtn = document.createElement('button');
  noteBtn.className = 'card-action-btn';
  noteBtn.title = 'הערות';
  noteBtn.style.position = 'relative';
  noteBtn.innerHTML = `📝${hasNote ? '<span style="position:absolute;top:4px;right:4px;width:7px;height:7px;background:#e67e22;border-radius:50%;display:block"></span>' : ''}`;

  const panel = document.createElement('div');
  panel.style.cssText = `display:none;padding:6px 8px 2px;border-top:1px solid #f0f0f0;margin-top:4px`;
  const ta = document.createElement('textarea');
  ta.value = item.notes || '';
  ta.placeholder = 'הערות...';
  ta.style.cssText = 'width:100%;border:none;background:transparent;font-size:12px;color:#555;resize:none;outline:none;font-family:inherit;min-height:48px';
  ta.addEventListener('input', () => {
    item.notes = ta.value;
    const dot = noteBtn.querySelector('span');
    if (ta.value && !dot) noteBtn.insertAdjacentHTML('beforeend', '<span style="position:absolute;top:4px;right:4px;width:7px;height:7px;background:#e67e22;border-radius:50%;display:block"></span>');
    else if (!ta.value && dot) dot.remove();
    save();
  });
  panel.appendChild(ta);

  noteBtn.addEventListener('click', () => {
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    if (panel.style.display === 'block') ta.focus();
  });
  return { noteBtn, panel };
}

function renderShopRow(container, i, item) {
  const wrapper = document.createElement('div');
  wrapper.style = 'background:#fff;border-radius:10px;margin-bottom:6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)';
  const row = document.createElement('div');
  row.className = 'item-row';
  row.style = 'margin-bottom:0';
  row.innerHTML = `
    <div class="item-check ${item.done?'checked':''}" onclick="toggleItem(${i})"></div>
    <span class="item-text ${item.done?'done':''}">${item.text}</span>
    <button class="card-action-btn" onclick="startEditText(${i}, this.previousElementSibling)">✎</button>`;
  const { noteBtn, panel } = makeNotesPanel(i, item);
  row.appendChild(noteBtn);
  const delBtn = document.createElement('button');
  delBtn.className = 'item-del';
  delBtn.textContent = '✕';
  delBtn.onclick = () => deleteItem(i);
  row.appendChild(delBtn);
  wrapper.appendChild(row);
  wrapper.appendChild(panel);
  container.appendChild(wrapper);
}

function renderTaskCard(container, i, item) {
  const pri = PRI[item.priority||'none'];
  const card = document.createElement('div');
  card.className = 'task-card';

  let dateHtml = '';
  if (item.date) {
    const d = new Date(item.date + 'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    const overdue = !item.done && d < today;
    const label = d.toLocaleDateString('he-IL', {day:'numeric',month:'short',year:'numeric'});
    dateHtml = `<span class="task-date ${overdue?'overdue':''}" title="לחץ לעריכת תאריך"
      onclick="editDate(${i}, this)">${overdue?'⚠️ ':' 📅 '}${label}</span>`;
  } else {
    dateHtml = `<span class="task-date" style="color:#ccc;cursor:pointer" title="הוסף תאריך"
      onclick="editDate(${i}, this)">+ תאריך</span>`;
  }

  const { noteBtn, panel } = makeNotesPanel(i, item);
  card.innerHTML = `
    <div style="display:flex">
      <div style="width:5px;background:${item.done?'#ddd':pri.bg};border-radius:12px 0 0 12px;flex-shrink:0"></div>
      <div style="flex:1">
        <div class="task-main">
          <div class="item-check ${item.done?'checked':''}" style="border-color:${pri.fg}" onclick="toggleItem(${i})"></div>
          <span class="item-text ${item.done?'done':''}" style="font-size:14px">${item.text}</span>
          <button class="card-action-btn" onclick="startEditText(${i}, this.previousElementSibling)">✎</button>
          <span id="note-btn-task-${i}"></span>
          <button class="item-del" onclick="deleteItem(${i})">✕</button>
        </div>
        <div class="task-footer">
          ${dateHtml}
          <span class="pri-tag" style="background:${pri.bg};color:${pri.fg}"
                onclick="cyclePriority(${i})">${pri.label||'ללא עדיפות'}</span>
        </div>
        <span id="note-panel-task-${i}"></span>
      </div>
    </div>`;
  container.appendChild(card);
  card.querySelector(`#note-btn-task-${i}`).replaceWith(noteBtn);
  card.querySelector(`#note-panel-task-${i}`).replaceWith(panel);
}

async function fetchPrice(ticker) {
  try {
    const res  = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${FINNHUB_KEY}`);
    const d = await res.json();
    return { current: d.c || null, open: d.o || null };
  } catch(e) { return { current: null, open: null }; }
}

const stockCache = {};
let stockRefreshTimer = null;

function updateSummaryBar() {
  const el = document.getElementById('stock-summary');
  if (!el) return;
  const list = data.lists[currentListIdx];
  if (!list) return;
  const dayPcts = [], recPcts = [];
  list.items.forEach((item, i) => {
    const cur = stockCache[i];
    const open = stockOpenCache[i];
    const rec  = parseFloat(item.recPrice) || 0;
    if (cur && open) dayPcts.push((cur - open) / open * 100);
    if (cur && rec)  recPcts.push((cur - rec)  / rec  * 100);
  });
  const avg = arr => arr.length ? arr.reduce((a,b) => a+b, 0) / arr.length : null;
  const fmt = (v, label) => {
    if (v === null) return '';
    const color = v >= 0 ? '#27ae60' : '#e74c3c';
    const sign  = v >= 0 ? '+' : '';
    return `${label}: <span style="color:${color};font-weight:700">${sign}${v.toFixed(1)}%</span>`;
  };
  const dayAvg = avg(dayPcts);
  const recAvg = avg(recPcts);
  const parts = [fmt(dayAvg, 'ממוצע יומי'), fmt(recAvg, 'ממוצע מאז המלצה')].filter(Boolean);
  const now = new Date().toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  el.innerHTML = (parts.join(' &nbsp;|&nbsp; ') || '') + `<span style="color:#4a90d9;font-size:11px;font-weight:600;margin-right:8px">🕐 ${now}</span>`;
}

const stockOpenCache = {};

function updateStockEl(i, item, quote) {
  const recPrice = parseFloat(item.recPrice) || 0;
  const { current, open } = quote;
  stockCache[i] = current;
  stockOpenCache[i] = open;
  const el = document.getElementById('sp-' + i);
  if (!el) return;
  if (current) {
    const pct      = recPrice ? ((current - recPrice) / recPrice * 100) : 0;
    const color    = pct >= 0 ? '#27ae60' : '#e74c3c';
    const sign     = pct >= 0 ? '+' : '';
    const dayPct   = open ? ((current - open) / open * 100) : null;
    const dayColor = dayPct !== null ? (dayPct >= 0 ? '#27ae60' : '#e74c3c') : '#aaa';
    const daySign  = dayPct !== null && dayPct >= 0 ? '+' : '';
    const openLabel = open ? `<span style="font-size:10px;color:#aaa">פתיחה: $${open.toFixed(2)} · </span>` : '';
    const dayStr   = dayPct !== null
      ? `<span style="font-size:10px;display:block">${openLabel}<span style="color:${dayColor}">יומי: ${daySign}${dayPct.toFixed(1)}%</span></span>`
      : '';
    el.innerHTML = `<span style="color:#222;font-weight:700">$${current.toFixed(2)}</span> <span style="color:${color};font-size:12px">(${sign}${pct.toFixed(1)}%)</span>${dayStr}`;
  } else {
    el.textContent = 'לא נמצא';
  }
  updateSummaryBar();
}

function startStockRefresh() {
  stopStockRefresh();
  stockRefreshTimer = setInterval(() => {
    const list = data.lists[currentListIdx];
    if (!list || list.type !== 'stocks') return;
    list.items.forEach((item, i) => {
      fetchPrice(item.ticker).then(quote => updateStockEl(i, item, quote));
    });
  }, 30000);
}

function stopStockRefresh() {
  if (stockRefreshTimer) { clearInterval(stockRefreshTimer); stockRefreshTimer = null; }
}

function renderStockRow(container, i, item) {
  const recPrice  = parseFloat(item.recPrice) || 0;
  const recDate   = item.recDate || '';
  const analyst   = item.analyst || '';
  const list      = data.lists[currentListIdx];
  const isPortfolio = list.stockMode === 'portfolio';
  const dateLabel = isPortfolio ? 'קניה' : 'המלצה';
  const analystLabel = isPortfolio ? '' : analyst;
  const row = document.createElement('div');
  row.style = 'background:#fff;border-radius:12px;margin-bottom:8px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)';
  row.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px">
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:15px">${item.ticker} <span style="font-size:11px;color:#888;font-weight:400">${analystLabel}</span></div>
        <div style="font-size:11px;color:#aaa">${recDate} · ${dateLabel}: $${recPrice.toFixed(2)}</div>
      </div>
      <div id="sp-${i}" style="font-size:13px;font-weight:700;color:#888;white-space:nowrap">טוען...</div>
      <button onclick="aiAnalyze(${i})" id="ai-btn-${i}" style="border:none;background:#e8f2fd;color:#4a90d9;border-radius:8px;padding:5px 8px;font-size:14px;cursor:pointer;flex-shrink:0">🤖</button>
      <button class="card-action-btn" onclick="editStockItem(${i})">✎</button>
      <span id="note-btn-stock-${i}"></span>
      <button class="item-del" onclick="deleteItem(${i})">✕</button>
    </div>
    <div id="ar-${i}" style="display:none;margin-top:8px;padding:8px;background:#f8f9fa;border-radius:8px;font-size:12px;color:#333;line-height:1.6;position:relative"></div>
    <span id="note-panel-stock-${i}"></span>`;
  container.appendChild(row);
  const { noteBtn: snb, panel: sp } = makeNotesPanel(i, item);
  row.querySelector(`#note-btn-stock-${i}`).replaceWith(snb);
  row.querySelector(`#note-panel-stock-${i}`).replaceWith(sp);

  fetchPrice(item.ticker).then(quote => updateStockEl(i, item, quote));
}

async function aiAnalyze(i) {
  const item     = data.lists[currentListIdx].items[i];
  const recPrice = parseFloat(item.recPrice) || 0;
  const current  = stockCache[i] || null;
  const btn      = document.getElementById(`ai-btn-${i}`);
  const resultEl = document.getElementById('ar-' + i);
  if (!btn || !resultEl) return;

  btn.textContent        = '⏳';
  btn.disabled           = true;
  resultEl.style.display = 'block';
  resultEl.textContent   = 'מנתח...';

  const pct = recPrice && current ? ((current - recPrice) / recPrice * 100).toFixed(1) : 'לא ידוע';

  // fetch recent news headlines from Finnhub
  let newsText = '';
  try {
    const today = new Date();
    const from  = new Date(item.recDate || today);
    const fromStr = from.toISOString().slice(0,10);
    const toStr   = today.toISOString().slice(0,10);
    const nr = await fetch(`https://finnhub.io/api/v1/company-news?symbol=${item.ticker}&from=${fromStr}&to=${toStr}&token=${FINNHUB_KEY}`);
    const news = await nr.json();
    if (Array.isArray(news) && news.length > 0) {
      const headlines = news.slice(0, 8).map(n => '- ' + n.headline).join('\n');
      newsText = `\n\nכותרות חדשות מהתקופה:\n${headlines}`;
    }
  } catch(e) { /* news fetch failed, continue without */ }

  const today = new Date().toLocaleDateString('he-IL', {year:'numeric',month:'long',day:'numeric'});
  const list        = data.lists[currentListIdx];
  const isPortfolio = list.stockMode === 'portfolio';
  const context     = isPortfolio
    ? `המניה ${item.ticker} נקנתה בתאריך ${item.recDate||'לא ידוע'} בשער $${recPrice}. השער הנוכחי הוא ${current ? '$'+current.toFixed(2) : 'לא ידוע'} (${pct}% שינוי).`
    : `המניה ${item.ticker} הומלצה על ידי ${item.analyst||'אנליסט'} בתאריך ${item.recDate||'לא ידוע'} בשער $${recPrice}. השער הנוכחי הוא ${current ? '$'+current.toFixed(2) : 'לא ידוע'} (${pct}% שינוי).`;
  const instruction = isPortfolio
    ? `כתוב ניתוח בעברית בשני חלקים:\n1. תיאור קצר (2 משפטים): מה החברה עושה ובאיזה תחום היא פועלת.\n2. ניתוח (3-4 משפטים): מה קרה מאז הקניה לפי החדשות, האם ההשקעה הצליחה, ומה כדאי לשים לב אליו.`
    : `כתוב ניתוח בעברית בשני חלקים:\n1. תיאור קצר (2 משפטים): מה החברה עושה ובאיזה תחום היא פועלת.\n2. ניתוח (3-4 משפטים): מה קרה מאז ההמלצה לפי החדשות, האם ההמלצה הייתה טובה, ומה כדאי לשים לב אליו.`;
  const prompt = `היום: ${today}.\n${context}${newsText}\n\n${instruction}`;

  try {
    const res  = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type':'application/json','x-api-key':CLAUDE_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model:'claude-haiku-4-5-20251001', max_tokens:600, messages:[{role:'user',content:prompt}] })
    });
    const d = await res.json();
    const txt = d.content?.[0]?.text || d.error?.message || JSON.stringify(d);
    resultEl.innerHTML = `<button onclick="document.getElementById('ar-${i}').style.display='none';document.getElementById('ai-btn-${i}').textContent='🤖';" style="position:absolute;top:4px;left:4px;border:none;background:none;font-size:14px;cursor:pointer;color:#aaa">✕</button><span style="display:block;padding-right:4px">${txt.replace(/\n/g,'<br>')}</span>`;
  } catch(e) {
    resultEl.textContent = 'שגיאה: ' + e.message;
  }
  btn.textContent = '📖';
  btn.disabled    = false;
  btn.onclick = () => {
    const ar = document.getElementById('ar-' + i);
    if (ar.style.display === 'none') ar.style.display = 'block';
    else ar.style.display = 'none';
  };
}

function editStockItem(i) {
  const item = data.lists[currentListIdx].items[i];
  const list = data.lists[currentListIdx];
  const isPortfolio = list.stockMode === 'portfolio';
  const analystLabel = isPortfolio ? 'הערה' : 'אנליסט';
  showConfirm(`עדכן ${item.ticker}?`, (yes) => {
    if (!yes) return;
    const ticker  = prompt('טיקר:', item.ticker);
    if (!ticker) return;
    const price   = prompt('שער ' + (isPortfolio ? 'קניה' : 'המלצה') + ':', item.recPrice);
    const date    = prompt('תאריך (YYYY-MM-DD):', item.recDate || '');
    const analyst = prompt(analystLabel + ':', item.analyst || '');
    item.ticker   = ticker.toUpperCase().trim();
    item.recPrice = parseFloat(price) || item.recPrice;
    item.recDate  = date || item.recDate;
    item.analyst  = analyst || '';
    save();
    renderItems();
  });
}

function addStock() {
  const ticker  = document.getElementById('new-stock-ticker').value.trim().toUpperCase();
  const price   = document.getElementById('new-stock-price').value.trim();
  const date    = document.getElementById('new-stock-date').value;
  const analyst = document.getElementById('new-stock-analyst').value.trim();
  if (!ticker || !price) return;
  data.lists[currentListIdx].items.push({ ticker, recPrice: parseFloat(price), recDate: date, analyst, done: false });
  save(); renderItems();
  document.getElementById('new-stock-ticker').value  = '';
  document.getElementById('new-stock-price').value   = '';
  document.getElementById('new-stock-date').value    = '';
  document.getElementById('new-stock-analyst').value = '';
  document.getElementById('new-stock-ticker').focus();
}

function renderLinkRow(container, i, item) {
  const wrapper = document.createElement('div');
  wrapper.style = 'background:#fff;border-radius:10px;margin-bottom:6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)';
  const row = document.createElement('div');
  row.className = 'item-row';
  row.style = 'cursor:pointer;margin-bottom:0';
  row.innerHTML = `
    <span style="font-size:20px">🔗</span>
    <div style="flex:1;min-width:0">
      <div class="item-text" style="font-weight:600">${item.text}</div>
      <div style="font-size:11px;color:#4a90d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.url||''}</div>
    </div>
    <button class="card-action-btn edit-link-btn">✎</button>`;
  const { noteBtn, panel } = makeNotesPanel(i, item);
  row.appendChild(noteBtn);
  const delBtn = document.createElement('button');
  delBtn.className = 'item-del';
  delBtn.textContent = '✕';
  delBtn.onclick = (e) => { e.stopPropagation(); deleteItem(i); };
  row.appendChild(delBtn);
  row.querySelector('.edit-link-btn').addEventListener('click', e => {
    e.stopPropagation();
    row.removeEventListener('click', openLink);
    startEditLink(i, row);
  });
  function openLink() { if (item.url) window.open(item.url, '_blank'); }
  row.addEventListener('click', openLink);
  wrapper.appendChild(row);
  wrapper.appendChild(panel);
  container.appendChild(wrapper);
}

function startEditLink(i, row) {
  const item = data.lists[currentListIdx].items[i];
  row.innerHTML = `
    <span style="font-size:20px">🔗</span>
    <div style="flex:1;display:flex;flex-direction:column;gap:4px">
      <input class="item-edit-input" id="edit-link-name-${i}" value="${item.text}" placeholder="שם">
      <input class="item-edit-input" id="edit-link-url-${i}"  value="${item.url||''}" placeholder="קישור" type="url">
    </div>
    <button class="add-btn" style="background:#27ae60;width:36px;height:36px" id="edit-link-save-${i}">✓</button>`;
  function commit() {
    const name = document.getElementById(`edit-link-name-${i}`).value.trim();
    const url  = document.getElementById(`edit-link-url-${i}`).value.trim();
    if (name) { item.text = name; item.url = url; }
    data.lists[currentListIdx].items[i] = item;
    save(); renderItems();
  }
  document.getElementById(`edit-link-save-${i}`).addEventListener('click', commit);
  document.getElementById(`edit-link-name-${i}`).focus();
}

function addLink() {
  const name = document.getElementById('new-link-name').value.trim();
  const url  = document.getElementById('new-link-url').value.trim();
  if (!name) return;
  const list = data.lists[currentListIdx];
  list.items.push({ text: name, url: url || '', done: false });
  save(); renderItems();
  document.getElementById('new-link-name').value = '';
  document.getElementById('new-link-url').value  = '';
  document.getElementById('new-link-name').focus();
}

// ── Shopping CRUD ─────────────────────────────────────────────────────────
function addItem() {
  const input = document.getElementById('new-item-input');
  const text  = input.value.trim();
  if (!text) return;
  data.lists[currentListIdx].items.push({ text, done: false });
  save(); input.value = ''; renderItems(); input.focus();
}

// ── Task CRUD ─────────────────────────────────────────────────────────────
function setPri(p) {
  newTaskPri = p;
  document.querySelectorAll('#pri-sel .pri-btn').forEach(b => {
    b.classList.toggle('sel', b.dataset.p === p);
  });
}

function addTask() {
  const input = document.getElementById('new-task-input');
  const text  = input.value.trim();
  if (!text) return;
  const date = document.getElementById('new-task-date').value;
  data.lists[currentListIdx].items.push({ text, done: false, priority: newTaskPri, date: date||'' });
  save();
  input.value = '';
  document.getElementById('new-task-date').value = '';
  setPri('none');
  renderItems();
  input.focus();
}

function editDate(i, span) {
  const item = data.lists[currentListIdx].items[i];
  const input = document.createElement('input');
  input.type = 'date';
  input.className = 'date-input';
  input.style.cssText = 'width:130px;font-size:12px;padding:3px 6px';
  input.value = item.date || '';
  span.replaceWith(input);
  input.focus();
  function commit() {
    item.date = input.value || '';
    save(); renderItems();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('change', () => { input.blur(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { save(); renderItems(); }
  });
}

function cyclePriority(i) {
  const item = data.lists[currentListIdx].items[i];
  const cur  = item.priority || 'none';
  const next = PRI_ORDER[(PRI_ORDER.indexOf(cur) + 1) % PRI_ORDER.length];
  item.priority = next;
  save(); renderItems();
}

// ── Shared ────────────────────────────────────────────────────────────────
function toggleItem(i) {
  data.lists[currentListIdx].items[i].done ^= true;
  save(); renderItems();
}

function deleteItem(i) {
  data.lists[currentListIdx].items.splice(i, 1);
  save(); renderItems();
}

let _touchTimer = null;

function handleTouchStart(e, i, span) {
  _touchTimer = setTimeout(() => { startEditText(i, span); }, 600);
}

function handleTouchEnd(e) {
  clearTimeout(_touchTimer);
}

function startEditText(i, span) {
  const input = document.createElement('input');
  input.className = 'item-edit-input';
  input.value = data.lists[currentListIdx].items[i].text;
  span.replaceWith(input);
  input.focus(); input.select();
  function commit() {
    const val = input.value.trim();
    if (val) data.lists[currentListIdx].items[i].text = val;
    save(); renderItems();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { save(); renderItems(); }
  });
}

// ── Template ──────────────────────────────────────────────────────────────
function openTemplate() {
  document.getElementById('new-template-input').value = '';
  renderTemplateItems();
  showScreen('screen-template');
}

function renderTemplateItems() {
  const container = document.getElementById('template-items-list');
  container.innerHTML = '';
  if (!data.template.length) {
    container.innerHTML = `<div class="empty-msg">
      <span class="big">⭐</span>הוסף פריטים קבועים<br>שיופיעו בכל רשימת קניות חדשה
    </div>`;
    return;
  }
  data.template.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <span style="font-size:16px">⭐</span>
      <span class="item-text">${text}</span>
      <button class="card-action-btn edit-tpl-btn">✎</button>
      <button class="item-del" onclick="deleteTemplateItem(${i})">✕</button>`;
    const span = row.querySelector('.item-text');
    row.querySelector('.edit-tpl-btn').addEventListener('click', () => startEditTemplate(i, span));
    container.appendChild(row);
  });
}

function addTemplateItem() {
  const input = document.getElementById('new-template-input');
  const text  = input.value.trim();
  if (!text) return;
  data.template.push(text);
  save(); input.value = ''; renderTemplateItems(); input.focus();
}

function deleteTemplateItem(i) {
  data.template.splice(i, 1);
  save(); renderTemplateItems();
}

function startEditTemplate(i, span) {
  const input = document.createElement('input');
  input.className = 'item-edit-input';
  input.value = data.template[i];
  span.replaceWith(input);
  input.focus(); input.select();
  function commit() {
    const val = input.value.trim();
    if (val) data.template[i] = val;
    save(); renderTemplateItems();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { save(); renderTemplateItems(); }
  });
}

// ── Admin ─────────────────────────────────────────────────────────────────
function openAdmin() {
  renderAdminUsers();
  showScreen('screen-admin');
}

function normalizeList(raw) {
  return (raw || []).map(u => typeof u === 'string' ? { email: u, active: true } : u);
}

async function renderAdminUsers() {
  const container = document.getElementById('admin-users-list');
  container.innerHTML = '<div style="color:#aaa;font-size:13px">טוען...</div>';
  const snap = await getDoc(CONFIG_DOC);
  const list = normalizeList(snap.exists() ? snap.data().allowed : []);
  container.innerHTML = '';
  list.forEach(u => {
    const isAdmin = u.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
    const row = document.createElement('div');
    row.style = 'display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee';
    row.innerHTML = `
      <div style="flex:1">
        <div style="font-size:14px;color:${u.active ? '#333' : '#aaa'}">${u.email}</div>
        <div style="font-size:11px;color:${u.active ? '#27ae60' : '#e74c3c'}">${u.active ? 'פעיל' : 'מושהה'}</div>
      </div>
      ${isAdmin ? '' : `
        <button onclick="toggleUserActive('${u.email}',${!u.active})" style="border:none;background:${u.active ? '#fff3cd' : '#d4edda'};color:${u.active ? '#856404' : '#276036'};padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer">
          ${u.active ? 'השהה' : 'הפעל'}
        </button>
        <button onclick="removeAllowedUser('${u.email}')" style="border:none;background:none;color:#e74c3c;font-size:18px;cursor:pointer">✕</button>
      `}`;
    container.appendChild(row);
  });
  if (!list.length) container.innerHTML = '<div style="color:#aaa;font-size:13px">אין משתמשים</div>';
}

async function addAllowedUser() {
  const input = document.getElementById('new-user-input');
  const email = input.value.trim().toLowerCase();
  if (!email || !email.includes('@')) { alert('מייל לא תקין'); return; }
  try {
    const snap = await getDoc(CONFIG_DOC);
    const list = normalizeList(snap.exists() ? snap.data().allowed : []);
    if (list.find(u => u.email.toLowerCase() === email)) { alert('מייל כבר קיים'); return; }
    list.push({ email, active: true });
    await setDoc(CONFIG_DOC, { allowed: list });
    input.value = '';
    renderAdminUsers();
  } catch(e) {
    alert('שגיאה: ' + e.message);
  }
}

async function toggleUserActive(email, newState) {
  const snap = await getDoc(CONFIG_DOC);
  const list = normalizeList(snap.exists() ? snap.data().allowed : []);
  const user = list.find(u => u.email.toLowerCase() === email.toLowerCase());
  if (user) user.active = newState;
  await setDoc(CONFIG_DOC, { allowed: list });
  renderAdminUsers();
}

async function removeAllowedUser(email) {
  if (!confirm(`למחוק את ${email}?`)) return;
  const snap = await getDoc(CONFIG_DOC);
  const list = normalizeList(snap.exists() ? snap.data().allowed : []).filter(u => u.email.toLowerCase() !== email.toLowerCase());
  await setDoc(CONFIG_DOC, { allowed: list });
  renderAdminUsers();
}

function shareListWhatsapp() {
  const list = data.lists[currentListIdx];
  if (!list) return;
  const doShare = (includeDone) => {
    const lines = [`*${list.name}*`, `${'─'.repeat(list.name.length)}`, ''];
    list.items.forEach(item => {
      if (!includeDone && item.done) return;
      if (list.type === 'links') lines.push(`• ${item.text}${item.url ? '\n  ' + item.url : ''}`);
      else lines.push(`${item.done ? '✓' : '•'} ${item.text}`);
    });
    const text = encodeURIComponent(lines.join('\n'));
    location.href = `https://wa.me/?text=${text}`;
  };
  showConfirm('לכלול פריטים שסומנו כ"נעשו"?', doShare);
}
